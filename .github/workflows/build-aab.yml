name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Release Keystore and key.properties
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -storepass releasepassword123 -keypass releasepassword123 \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=KidsDrawing, OU=Mobile, O=KidsDrawing, L=Bengaluru, S=Karnataka, C=IN"
          
          cat <<EOF > android/key.properties
          storePassword=releasepassword123
          keyPassword=releasepassword123
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android App Bundle (AAB) & APK
        run: |
          flutter build appbundle --release --android-skip-build-dependency-validation
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
